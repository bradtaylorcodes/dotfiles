# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# The default module list ($all) minus language/toolchain versions, package
# versions and battery
format = """\
$username$hostname$localip$shlvl$singularity$kubernetes$nats\
$directory$vcsh$fossil_branch$fossil_metrics\
$git_branch$git_commit$git_state$git_metrics$git_status\
$hg_branch$hg_state$pijul_channel$docker_context\
$guix_shell$nix_shell$memory_usage$aws$gcloud$openstack$azure$direnv$env_var\
$custom$sudo$cmd_duration$line_break$jobs$time$status$container$netns$os$shell\
$character"""

# Sets user-defined palette
# Palettes must be defined _after_ this line
palette = "catppuccin_mocha"

# Starship modules
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](subtext1)" # For use with zsh-vi-mode

[git_branch]
style = "bold mauve"
format = "[$symbol$branch(:$remote_branch)]($style) "

[directory]
truncation_length = 4
style = "bold lavender"

[line_break]
disabled = true

# Palette definitions
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
